<div class="addon">
  <label>
    <input class="addon-checkbox hidden" type="checkbox" />
    <span class="addon-check" aria-hidden="true"></span>
    <span class="addon-image">[[ProductImage]]</span>
    <span class="addon-number hidden">[[ProductNumber]]</span>
    <span class="addon-name">[[ProductName]]</span>
    <span class="addon-price">[[Price]]&nbsp;[[Currency]]</span>
  </label>
</div>
