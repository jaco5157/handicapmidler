<div class="textbox textbox-{{color}} box-shadow-sm col col-lg-4">
    <div class="textbox-header">
        <h2 class="textbox-title">{{heading}}</h2>
        <div class="textbox-logo">
            <span class="textbox-icon" style="--hm-textbox-icon: url('{{icon}}');" aria-hidden="true"></span>
        </div>
    </div>
    <div class="textbox-content">
        {{text}}
    </div>
</div>
