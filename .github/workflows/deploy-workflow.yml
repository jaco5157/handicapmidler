name: Deploy
on:
  push:
    branches: [ main ]
    paths:
      - 'storefront/assets/**'
      - '.github/workflows/deploy-workflow.yml'
    
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:    
  deploy-code:
    name: Deploy assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get codebase
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Minify files
        uses: docker://devatherock/minify-js:1.0.3
        with:
          directory: 'storefront/assets'

      - name: Verify minified files
        run: |
          test -s storefront/assets/javascripts.min.js
          test -s storefront/assets/styles.min.css

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./storefront/assets/
          server-dir: assets/
